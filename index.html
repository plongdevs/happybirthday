<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween - Cloudflare Turnstile</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <!-- Cloudflare Turnstile script -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        /* Reset & nền */
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #28282B;
            font-family: 'Comic Neue', sans-serif;
            margin: 0;
            min-height: 100vh;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.45);
            z-index: 2;
            backdrop-filter: blur(3px);
            transition: opacity 0.4s ease;
        }

        .overlay-body {
            position: relative;
            background: #ffffff;
            border-radius: 8px;
            padding: 24px 28px 20px;
            text-align: center;
            box-shadow: 0 10px 60px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 94%;
            font-family: 'Roboto', Arial, sans-serif;
            min-height: 200px;
            overflow: hidden;
        }

        .overlay-title {
            font-family: 'Comic Neue', cursive;
            font-size: 24px;
            font-weight: 700;
            color: #2563EB;
            margin: 0 0 4px 0;
            letter-spacing: 0.5px;
        }

        .overlay-sub {
            font-family: 'Comic Neue', cursive;
            font-size: 15px;
            color: #2563EB;
            margin: 0 0 20px 0;
            opacity: 0.85;
        }

        .turnstile-wrapper {
            display: flex;
            justify-content: center;
            margin: 6px 0 10px;
            transition: all 0.5s ease;
            transform-origin: center center;
        }

        .turnstile-wrapper.minimize {
            position: fixed;
            top: 10px;
            right: 10px;
            transform: scale(0.3);
            z-index: 10;
            margin: 0;
            background: transparent;
        }

        .cf-turnstile {
            transform: scale(0.95);
            transform-origin: center center;
        }

        .verify-msg {
            color: #1a73e8;
            font-weight: 500;
            font-size: 15px;
            margin: 14px 0 2px;
            min-height: 24px;
            opacity: 0;
            transition: opacity 0.3s ease;
            font-family: 'Roboto', Arial, sans-serif;
        }
        .verify-msg.show {
            opacity: 1;
        }

        .ok-button {
            position: absolute;
            bottom: 20px;
            left: 20px;
            padding: 12px 36px;
            background-color: #22c55e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: scale(0) translateY(30px);
            opacity: 0;
            pointer-events: none;
        }
        .ok-button.show {
            transform: scale(1) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .ok-button:hover {
            background-color: #16a34a;
            transform: scale(1.05);
        }

        .scare {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            display: none;
            background: #000;
        }

        .scare video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        @media (max-width: 480px) {
            .overlay-body {
                padding: 20px 16px 16px;
                min-height: 180px;
            }
            .overlay-title {
                font-size: 20px;
            }
            .cf-turnstile {
                transform: scale(0.82);
            }
            .ok-button {
                padding: 10px 28px;
                font-size: 16px;
                bottom: 16px;
                left: 16px;
            }
        }

        @media (max-width: 380px) {
            .cf-turnstile {
                transform: scale(0.72);
            }
        }
    </style>
</head>

<body>

    <!-- Overlay -->
    <div id="overlay" class="overlay">
        <div class="overlay-body">
            <p class="overlay-title">Xác nhận bạn là con người</p>
            <p class="overlay-sub">Tích vào ô bên dưới</p>
            <div class="turnstile-wrapper" id="turnstileWrapper">
                <div class="cf-turnstile"
                data-sitekey="0x4AAAAAAEaGpfoU7OEsEqN_"
                data-callback="onTurnstileSuccess"
                data-theme="light"
                data-size="normal">
            </div>
        </div>
        <div id="verifyMsg" class="verify-msg">✅ Xác nhận thành công!</div>
        <button id="okButton" class="ok-button">OK</button>
    </div>
</div>

<!-- Video scare -->
<div id="scare" class="scare">
    <video id="video" src="./video.mp4" loop preload="auto" muted playsinline></video>
</div>

<script>
    window.onTurnstileSuccess = function(token) {
        const overlay = document.getElementById('overlay');
        const scare = document.getElementById('scare');
        const video = document.getElementById('video');
        const verifyMsg = document.getElementById('verifyMsg');
        const turnstileWrapper = document.getElementById('turnstileWrapper');
        const okButton = document.getElementById('okButton');

        verifyMsg.classList.add('show');
        turnstileWrapper.classList.add('minimize');
        okButton.classList.add('show');

        okButton.addEventListener('click', function() {
            // Ẩn overlay và hiện video
            overlay.style.display = 'none';
            scare.style.display = 'block';

            // Kích hoạt toàn màn hình (F11 ảo)
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else if (document.documentElement.webkitRequestFullscreen) { // Safari
                document.documentElement.webkitRequestFullscreen();
            } else if (document.documentElement.msRequestFullscreen) { // IE/Edge
                document.documentElement.msRequestFullscreen();
            }

            // Đảm bảo video tải và phát
            video.load();
            video.play().then(() => {
                console.log('Video đang phát ở chế độ toàn màn hình!');
            }).catch(err => {
                console.warn('Không thể tự động phát, hãy nhấn vào video.', err);
                const msg = document.createElement('div');
                msg.style.cssText = 'position:absolute; bottom:20px; left:50%; transform:translateX(-50%); color:#fff; background:rgba(0,0,0,0.6); padding:8px 16px; border-radius:20px; font-size:14px; z-index:3;';
                msg.textContent = 'Nhấn vào video để phát';
                document.getElementById('scare').appendChild(msg);
                setTimeout(() => msg.remove(), 3000);
            });
        });
    };

    // Khi nhấn vào video thì phát (nếu đang pause)
    document.addEventListener('DOMContentLoaded', function() {
        const video = document.getElementById('video');
        video.addEventListener('click', function() {
            if (video.paused) {
                video.play().catch(() => {});
            }
        });
    });
</script>

</body>

</html>
