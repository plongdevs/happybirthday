<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween - Cloudflare Turnstile</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <!-- Cloudflare Turnstile script -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        /* Reset & nền */
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #28282B;
            font-family: 'Comic Neue', sans-serif;
            margin: 0;
            min-height: 100vh;
        }

        /* Overlay chính */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.45);
            z-index: 2;
            backdrop-filter: blur(3px);
            transition: opacity 0.4s ease;
        }

        .overlay-body {
            background: #ffffff;
            border-radius: 8px;
            padding: 24px 28px 20px;
            text-align: center;
            box-shadow: 0 10px 60px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 94%;
            font-family: 'Roboto', Arial, sans-serif;
        }

        .overlay-title {
            font-family: 'Comic Neue', cursive;
            font-size: 24px;
            font-weight: 700;
            color: #2563EB;
            margin: 0 0 4px 0;
            letter-spacing: 0.5px;
        }

        .overlay-sub {
            font-family: 'Comic Neue', cursive;
            font-size: 15px;
            color: #2563EB;
            margin: 0 0 20px 0;
            opacity: 0.85;
        }

        /* Container cho Turnstile (căn giữa) */
        .turnstile-wrapper {
            display: flex;
            justify-content: center;
            margin: 6px 0 10px;
        }

        /* Turnstile widget sẽ tự động style, nhưng ta có thể điều chỉnh scale nhỏ trên mobile */
        .cf-turnstile {
            transform: scale(0.95);
            transform-origin: center center;
        }

        /* Tin nhắn xác nhận (hiện khi thành công) */
        .verify-msg {
            color: #1a73e8;
            font-weight: 500;
            font-size: 15px;
            margin: 14px 0 2px;
            min-height: 24px;
            opacity: 0;
            transition: opacity 0.3s ease;
            font-family: 'Roboto', Arial, sans-serif;
        }
        .verify-msg.show {
            opacity: 1;
        }

        /* Video scare */
        .scare {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            display: none;
            background: #000;
        }

        .scare video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .overlay-body {
                padding: 20px 16px 16px;
            }
            .overlay-title {
                font-size: 20px;
            }
            .cf-turnstile {
                transform: scale(0.82);
            }
        }

        @media (max-width: 380px) {
            .cf-turnstile {
                transform: scale(0.72);
            }
        }
    </style>
</head>

<body>
    <div id="overlay" class="overlay">
        <div class="overlay-body">

            <p class="overlay-title">Xác nhận bạn là con người</p>
            <p class="overlay-sub">Tích vào ô bên dưới</p>
            <div class="turnstile-wrapper">
            <div class="cf-turnstile"data-sitekey="0x4AAAAAAEaGpfoU7OEsEqN_"data-callback="onTurnstileSuccess"data-theme="light"data-size="normal">
            </div>
        </div>

        <div id="verifyMsg" class="verify-msg">✅ Xác nhận thành công!</div>
    </div>
</div>

<!-- Video scare -->
<div id="scare" class="scare"><video id="video"src="./video.mp4"loop preload="auto"></video>
</div>
<script>
    window.onTurnstileSuccess = function(token) {
        const overlay = document.getElementById('overlay');
        const scare = document.getElementById('scare');
        const video = document.getElementById('video');
        const verifyMsg = document.getElementById('verifyMsg');
        verifyMsg.classList.add('show');
        setTimeout(function() {
            overlay.style.display = 'none';
            scare.style.display = 'block';
            video.play().catch(function(err) {
                console.warn('Autoplay bị chặn, nhấn vào video để phát.');
            });
        }, 500);
    };
    document.addEventListener('DOMContentLoaded', function() {
        const video = document.getElementById('video');
        video.addEventListener('click', function() {
            if (video.paused) {
                video.play().catch(function() {});
            }
        });
    });

</script>

</body>

</html>
